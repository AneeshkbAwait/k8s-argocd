apiVersion: v1
kind: Pod
metadata:
  name: "mywebapp"
  labels:
    env: "dev"
    layer: "frontend"
  namespace: "webapp"
spec:
  containers:
  - name: "mywebapp-container"
    image: "aneeshkbawaits/webapp:v1"
    ports:
    - name: "http"
      containerPort: 80
    - name: "https"
      containerPort: 443
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
      limits:
        cpu: "100m"
        memory: "100Mi"

